<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anti-Microsleep · ภาพสด + แผนที่</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f17; color: #eef1f4;
               font: 16px/1.4 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif; }
  body { display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
         background: #12161b; border-bottom: 1px solid #2b323c; }
  .back { display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px 0 12px; border-radius: 999px;
          background: #3d8bfd; color: #fff; font-weight: 700; font-size: 15px; text-decoration: none; flex: none;
          box-shadow: 0 2px 8px rgba(61,139,253,.35); }
  .back:hover { filter: brightness(1.1); }
  .back .arr { font-size: 20px; line-height: 1; }
  .top b { font-size: 15px; color: #95a0ad; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wrap { flex: 1; min-height: 0; display: flex; gap: 4px; }
  iframe { border: 0; height: 100%; background: #0b0f17; }
  #live { flex: 3; }
  #map  { flex: 2; min-width: 320px; }
  /* phone / narrow: stack, live feed on top */
  @media (max-width: 800px) {
    .wrap { flex-direction: column; }
    iframe { width: 100%; }
    #live { flex: 1; }
    #map  { flex: 1; min-width: 0; }
  }
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/driver.html" title="กลับหน้าแผนที่คนขับ"><span class="arr">←</span> กลับแผนที่</a>
  <b>ภาพสด + แผนที่</b>
</div>
<div class="wrap">
  <iframe id="live" src="/" title="ภาพสด"></iframe>
  <iframe id="map" src="/driver.html" title="แผนที่คนขับ"></iframe>
</div>
</body>
</html>
